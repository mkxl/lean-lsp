[package]
name = "lean-lsp"
version = "0.1.0"
edition = "2024"
description = "lean-lsp"
readme = "README.md"
repository = "https://github.com/mkxl/lean-lsp.git"
license = "Apache-2.0"
keywords = ["lean", "lsp"]
categories = ["mathematics"]

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
camino = { version = "1.2.1", features = ["serde1"] }
clap = { version = "4.5.53", features = ["derive", "env", "string"] }
crossterm = { version = "0.29.0", features = ["event-stream", "libc", "serde", "use-dev-tty"] }
derive_more = { version = "2.0.1", features = ["constructor", "debug", "display", "from"] }
enum-assoc = "1.2.4"
futures = "0.3.31"
getset = "0.1.6"
mkutils = { version = "0.1.133", features = ["async", "serde", "tracing", "tui", "unstable"] }
ratatui = { version = "0.30.0", features = ["crossterm", "unstable-backend-writer"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.17"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["json", "valuable"] }
ulid = { version = "1.2.1", features = ["serde"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
cargo = "deny"
nursery = "deny"
pedantic = "deny"
duplicated_attributes = { level = "allow", priority = 1 }
future_not_send = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
unit_arg = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }

[patch.crates-io]
crossterm = { git = 'https://github.com/crossterm-rs/crossterm', rev = "4f08595" }
